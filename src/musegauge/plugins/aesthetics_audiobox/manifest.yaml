schema: 1
plugin_id: aesthetics_audiobox
family: aesthetics
description: "Audiobox Aesthetics scores (CE, CU, PC, PQ) for each clip, through audiobox-aesthetics"
kind: clip
python: "3.11"
requirements_in: requirements.in
locks:
  linux-x86_64: locks/linux-x86_64.txt
